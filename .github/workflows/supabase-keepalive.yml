# Myriatale 이메일 로그인(Supabase 무료 요금제)이 7일 동안 안 쓰이면 자동으로 멈추는 것을 막는다.
# 매일 한 번(한국 시간 오전 9시) Supabase에 가벼운 요청을 보내 "사용 중" 상태로 유지한다.
# 주소·공개 키는 게임의 공개 설정(/api/auth/config)에서 읽으므로 따로 넣을 비밀 값이 없다.
# Actions 탭 → "Supabase keep-alive" → Run workflow 로 직접 돌려 볼 수도 있다.
name: Supabase keep-alive
on:
  schedule:
    - cron: "17 0 * * *"   # 매일 00:17 UTC = 09:17 KST
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        run: |
          set -u
          CFG=$(curl -fsS --retry 3 https://simulator-c36.pages.dev/api/auth/config)
          URL=$(echo "$CFG" | jq -r '.supabaseUrl // empty')
          KEY=$(echo "$CFG" | jq -r '.supabaseKey // empty')
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "게임 설정에서 Supabase 주소를 읽지 못했습니다."; exit 1; fi
          # 1) 로그인 서버 상태 확인
          A=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $KEY" "$URL/auth/v1/health")
          # 2) 데이터베이스에 가벼운 조회 1번 (결과는 비어 있어도 됨)
          D=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$URL/rest/v1/credits?select=user_id&limit=1")
          echo "auth health: $A / database: $D"
          if [ "$A" != "200" ]; then
            echo "::error::Supabase 로그인 서버 응답이 $A 입니다. 프로젝트가 멈췄다면 supabase.com 대시보드에서 Restore project를 눌러 주세요."
            exit 1
          fi
