<svg xmlns="http://www.w3.org/2000/svg" viewBox="78 90 294 204">
<!-- RageGom 화난곰 (final): lazy melted puddle body + dead-serious human head (square head, strong jaw). Transparent bg. -->
<g id="ragegom">
  <path id="ragegom-body" fill="#C9894A" stroke="#111" stroke-width="4" stroke-linejoin="round"
        d="M84,288 C84,268 112,258 136,246 C148,210 180,196 206,196 C236,196 258,214 270,238 C304,250 356,256 362,276 C364,284 358,288 350,288 Z"/>
  <g id="ragegom-ears" fill="#C9894A" stroke="#111" stroke-width="4" stroke-linejoin="round"><circle cx="162" cy="112" r="17"/><circle cx="250" cy="112" r="17"/></g>
  <path id="ragegom-head" fill="#C9894A" stroke="#111" stroke-width="4" stroke-linejoin="round"
        d="M206,96 C246,96 264,118 264,158 L264,212 C264,240 248,258 228,264 L184,264 C164,258 148,240 148,212 L148,158 C148,118 166,96 206,96 Z"/>
  <g id="ragegom-face" transform="translate(206,170)" stroke="#111" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M-38,-19 Q-24,-24 -10,-21 M10,-21 Q24,-24 38,-19" stroke-width="2.8"/>            <!-- thin brows -->
    <path d="M-31,0 A8,6.5 0 0 0 -15,0 Z M15,0 A8,6.5 0 0 0 31,0 Z" fill="#3A3A3A" stroke="none"/>  <!-- irises -->
    <circle cx="-23" cy="2.6" r="2.4" fill="#111" stroke="none"/><circle cx="23" cy="2.6" r="2.4" fill="#111" stroke="none"/>
    <path d="M-35,0 L-11,-1 M11,-1 L35,0" stroke-width="3"/>                                 <!-- flat upper lids -->
    <path d="M-29,8 Q-23,9.5 -17,8 M17,8 Q23,9.5 29,8" stroke-width="1.6"/>                   <!-- lower lids -->
    <!-- the over-detailed realistic nose -->
    <path d="M-6,4 C-2,14 -4,24 -9,31" stroke-width="2.2"/>
    <path d="M7,10 C8,17 9,22 10,27" stroke-width="1.6" opacity="0.55"/>
    <path d="M-9,31 C-17,31 -18,42 -10,43 C-6,47 6,47 10,43 C18,42 17,31 9,31" stroke-width="2.4"/>
    <path d="M-4,38 Q-8,41 -3.5,43 M4,38 Q8,41 3.5,43" stroke-width="2"/>
    <path d="M-12,58 Q0,56 12,58" stroke-width="2.6"/>                                         <!-- thin flat lips -->
    <path d="M-7,63 Q0,64 7,63" stroke-width="1.5" opacity="0.55"/>
  </g>
  <g id="ragegom-glasses" transform="translate(206,170)" stroke="#111" fill="none" stroke-linecap="round">
    <circle cx="-23" cy="1" r="17" stroke-width="3" fill="#FFFFFF" fill-opacity="0.08"/>
    <circle cx="23" cy="1" r="17" stroke-width="3" fill="#FFFFFF" fill-opacity="0.08"/>
    <path d="M-6,-1 Q0,-5 6,-1" stroke-width="3"/>
    <path d="M-40,-2 L-56,-6 M40,-2 L56,-6" stroke-width="3"/>
    <path d="M-33,-8 L-28,-12" stroke="#FFFFFF" stroke-width="2.5"/>   <!-- glint -->
  </g>
  <!-- optional "……" speech bubble -->
  <g id="ragegom-bubble">
    <path d="M286,96 L350,96 Q366,96 366,112 Q366,128 350,128 L312,128 L290,144 L298,128 L286,128 Q270,128 270,112 Q270,96 286,96 Z"
          fill="#FFFFFF" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
    <text x="318" y="118" text-anchor="middle" font-family="Fredoka, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-weight="600" font-size="20" fill="#111">……</text>
  </g>
</g>
</svg>
