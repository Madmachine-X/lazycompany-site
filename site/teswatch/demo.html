<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Teswatch 폰 앱 체험</title>
<style>
/* Colours = the app's light theme (mobile AppTheme.kt, LightPalette). */
.tw-demo{--bg:#f2f2f4;--panel:#fff;--panel2:#f2f3f5;--line:#e1e5e9;--border:#c9d0d6;--text:#14191e;--muted:#5c6770;
  --accent:#0f8a6c;--on-accent:#fff;--warn:#c0392b;--orange:#d9771c;--blue:#2a78c8;--sleep:#9cc3dd;
  display:flex;gap:28px;justify-content:center;align-items:flex-start;flex-wrap:wrap;
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--text);padding:16px;box-sizing:border-box}
.tw-demo *{box-sizing:border-box}
.tw-phone{width:340px;max-width:100%;height:680px;border:10px solid #14191e;border-radius:40px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;flex:none}
.tw-bar{height:52px;flex:none;display:flex;align-items:center;padding:0 4px 0 16px;background:var(--bg)}
.tw-bar .t{flex:1;min-width:0}
.tw-bar .n{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tw-bar .s{font-size:12px;color:var(--muted)}
.tw-body{flex:1;overflow-y:auto;padding:12px 16px 20px;display:flex;flex-direction:column;gap:16px}
.tw-demo button{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.tw-demo button:focus-visible,.tw-demo [data-tip]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tw-txtbtn{height:44px;padding:0 12px!important;font-size:15px;color:var(--muted)!important}
.tw-card{background:var(--panel);border:1px solid rgba(0,0,0,.06);border-radius:20px}
.tw-pad{padding:20px;display:flex;flex-direction:column;gap:12px}
.tw-panel{background:var(--panel);border:1px solid rgba(0,0,0,.06);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.tw-row{display:flex;align-items:center;gap:12px}
.tw-grow{flex:1;min-width:0}
.tw-muted{color:var(--muted);font-size:13px;line-height:1.5}
.tw-small{font-size:12px;color:var(--muted);line-height:1.5}
.tw-big{font-size:36px;font-weight:700;line-height:38px}
.tw-big small{font-size:20px}
.tw-h1{font-size:24px;font-weight:700}
.tw-h2{font-size:16px;font-weight:700}
.tw-sec{font-size:13px;font-weight:500;color:var(--muted);padding:8px 0 0 4px}
.tw-bold{font-weight:700;font-size:18px}
.tw-accent{color:var(--accent)}
.tw-warn{color:var(--warn)}
.tw-meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.tw-meter i{display:block;height:100%;background:var(--accent)}
.tw-hr{height:1px;background:var(--line)}
.tw-nav{display:flex;align-items:center;gap:12px;min-height:64px;padding:12px 16px;width:100%}
.tw-nav + .tw-nav{border-top:1px solid var(--line)}
.tw-nav .ti{font-size:15px;font-weight:500}
.tw-nav .ch{font-size:22px;color:var(--muted)}
.tw-stats{display:flex;gap:8px}
.tw-stat{flex:1;background:var(--panel2);border-radius:10px;padding:10px}
.tw-stat b{display:block;font-size:18px}
.tw-btn{height:44px;border-radius:22px;background:var(--accent)!important;color:var(--on-accent)!important;padding:0 20px!important;text-align:center!important;font-weight:500}
.tw-obtn{height:44px;border-radius:22px;border:1px solid var(--border)!important;padding:0 16px!important;text-align:center!important}
.tw-sw{width:44px;height:26px;border-radius:13px;background:var(--border);position:relative;flex:none}
.tw-sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.tw-sw.on{background:var(--accent)}
.tw-sw.on::after{left:21px}
.tw-map{height:150px;border-radius:12px;background:#e8ebee;position:relative;overflow:hidden}
.tw-chart{height:90px;border-radius:10px;background:var(--panel2)}
.tw-sel{box-shadow:0 0 0 2px var(--accent);border-radius:12px}
[data-tip]{cursor:pointer}
.tw-info{width:340px;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;min-height:180px}
.tw-info h3{margin:0 0 8px;font-size:18px}
.tw-info p{margin:0 0 8px;font-size:15px;line-height:1.6;color:var(--text)}
.tw-info .hint{color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){.tw-sw::after{transition:none}}
</style>
</head>
<body style="margin:0;background:#fff">
<div class="tw-demo" id="tw-demo">
  <div class="tw-phone" aria-label="Teswatch 폰 앱 예시 화면">
    <div class="tw-bar" id="tw-bar"></div>
    <div class="tw-body" id="tw-body"></div>
  </div>
  <div class="tw-info" id="tw-info" aria-live="polite"></div>
</div>
<script>
(function(){
// Every value below is a made-up example. No real car, place, VIN or drive is shown.
var TIPS={

 topbar:['상단 차 상태','차 이름과 배터리, 지금 주차 중인지 주행·충전 중인지를 항상 보여 줍니다.'],
 settings:['앱 설정','어떤 기록을 켤지, 요금·단위, 화면 테마, Tesla 로그인을 여기서 정합니다.'],
 carpanel:['지금 내 차','배터리와 주행 가능 거리, 잠김 여부, 주차한 지 얼마나 됐는지를 한 번에 봅니다. 앱을 열 때 차가 깨어 있으면 새로 읽고, 자는 차는 깨우지 않습니다.'],
 lock:['잠금 상태','차의 잠김 표시만 보고 판단합니다. 문이나 트렁크가 열려 있으면 "잠김 · 트렁크 열림"처럼 함께 보여 줍니다.'],

 park:['내 차 찾기','차에서 내린 뒤 5분 동안 걸어간 경로를 걸음과 방향으로 기록합니다. GPS가 안 잡히는 지하 주차장에서도 왔던 길을 되짚어 차로 돌아갈 수 있습니다.'],

 $('tw-body').innerHTML=S[name]();

}
function act(e){
 var t=e.target.closest('[data-tip],[data-go]');
 if(!t||!$('tw-demo').contains(t))return;
 var s=e.target.closest('[data-sw]')||t.querySelector('[data-sw]');
 if(s)s.classList.toggle('on');
 var k=t.getAttribute('data-tip'),go=t.getAttribute('data-go');
 if(go)show(go);
 else{var old=document.querySelector('.tw-sel');if(old)old.classList.remove('tw-sel');t.classList.add('tw-sel')}
 if(k)tip(k);
}
$('tw-demo').addEventListener('click',act);
$('tw-demo').addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button]')){e.preventDefault();act(e)}});
